name: Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        # You will need to get the "Deploy Hook" URL from your Render Dashboard
        # and add it to your GitHub Repository Secrets as RENDER_DEPLOY_HOOK_URL
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
